name: Agents daily digest

# 06:00 Australia/Adelaide. Adelaide is UTC+10:30 in summer and UTC+9:30 in winter,
# so run at both UTC times and only post when it's actually 06:xx in Adelaide.
on:
  schedule:
    - cron: '30 19 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Post even if it is not 6am in Adelaide'
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          FORCE: ${{ inputs.force }}
        with:
          script: |
            const hour = new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Adelaide', hour: '2-digit', hourCycle: 'h23' }).format(new Date())
            if (hour !== '06' && process.env.FORCE !== 'true') { core.info(`Adelaide hour is ${hour}, skipping`); return }

            const { owner, repo } = context.repo
            const pending = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'status:proposed', per_page: 100 })
            const items = pending.filter(i => !i.pull_request)
            if (items.length === 0) { core.info('Nothing waiting for approval, no email'); return }

            const has = (i, l) => i.labels.some(x => (x.name ?? x) === l)
            const videos = items.filter(i => has(i, 'type:video')).length
            const ideas = items.filter(i => has(i, 'type:new-game')).length
            const tasks = items.length - videos - ideas
            const parts = [tasks && `${tasks} task${tasks > 1 ? 's' : ''}`, ideas && `${ideas} idea${ideas > 1 ? 's' : ''}`, videos && `${videos} video${videos > 1 ? 's' : ''}`].filter(Boolean)

            let [digest] = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'digest', per_page: 1 })).data
            if (!digest) {
              digest = (await github.rest.issues.create({ owner, repo, title: 'Daily digest', labels: ['digest'],
                body: 'The 6am digest and PM updates are posted here. Subscribe to get them by email.' })).data
            }

            const link = `https://github.com/${owner}/${repo}/issues?q=is%3Aissue+is%3Aopen+label%3Astatus%3Aproposed`
            const top = items.slice(0, 10).map(i => `- #${i.number} ${i.title}`).join('\n')
            const body = `@ben-p-laws @lukelaws01 **${items.length} waiting for approval** (${parts.join(', ')}).\n\n${top}${items.length > 10 ? `\n- …and ${items.length - 10} more` : ''}\n\n[Review them](${link}). To approve, add the label \`status:approved\`; to reject, add \`status:rejected\` and say why.`
            await github.rest.issues.createComment({ owner, repo, issue_number: digest.number, body })
